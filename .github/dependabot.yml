version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 5
      semver-major-days: 10
    # A single @angular/* bump fails `npm ci` (ERESOLVE): the framework packages
    # pin each other as peers, so everything below moves in one PR. Dependabot
    # puts a dependency in the first group it matches, so order matters.
    groups:
      angular:
        patterns: ["@angular/*", "@angular-devkit/*", "@schematics/*", "typescript"]
        update-types: [minor, patch]
      # Groups cover version updates only unless they say otherwise, and a lone
      # security bump of one framework package is what breaks `npm ci`.
      angular-security:
        applies-to: security-updates
        patterns: ["@angular/*", "@angular-devkit/*", "@schematics/*", "typescript"]
      angular-major:
        patterns: ["@angular/*", "@angular-devkit/*", "@schematics/*", "typescript"]
        update-types: [major]
      capacitor:
        patterns: ["@capacitor/*"]
        # @capacitor/assets is a separate tool with its own version line.
        exclude-patterns: ["@capacitor/assets"]
        update-types: [minor, patch]
      capacitor-major:
        patterns: ["@capacitor/*"]
        exclude-patterns: ["@capacitor/assets"]
        update-types: [major]
      # @vitest/browser-playwright peer-pins the exact vitest version.
      vitest:
        patterns: ["vitest", "@vitest/*"]
      # Other dev-tool majors (biome, playwright, ...) stay one PR each.
      dev-tooling:
        dependency-type: development
        update-types: [minor, patch]
      runtime:
        dependency-type: production
        update-types: [minor, patch]
    ignore:
      # Angular's compiler-cli peer is typescript ">=6.0 <6.1": a TypeScript
      # minor or major breaks `npm ci` until Angular widens it. Drop these
      # entries when it does.
      - dependency-name: typescript
        update-types: ["version-update:semver-minor", "version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  # Dependabot only reads literal versions in build.gradle files. Most versions
  # live in android/variables.gradle (referenced as $xxxVersion), which it does
  # not read, so only the literals (AGP, google-services, org.json, the Gradle
  # wrapper) are updated; bump the rest by hand.
  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 5
      semver-major-days: 10
    groups:
      androidx-compose:
        patterns: ["androidx.*"]
      android-build:
        patterns: ["com.android.tools.build:*", "org.jetbrains.kotlin*", "com.google.gms:*"]

  # No swift ecosystem: ios/App/CapApp-SPM/Package.swift is generated by
  # `cap sync` ("DO NOT MODIFY") and pins capacitor-swift-pm to the exact
  # @capacitor/ios version, so the npm @capacitor group is what updates it.
