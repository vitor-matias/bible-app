name: Build All Platforms

on:
  workflow_dispatch:
    inputs:
      build_android:
        description: 'Build Android'
        required: true
        type: boolean
        default: true
      build_ios:
        description: 'Build iOS'
        required: true
        type: boolean
        default: true
      create_release:
        description: 'Create a GitHub Release'
        required: false
        type: boolean
        default: false
      bump:
        description: 'Version component to bump (patch / minor / major)'
        required: false
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major
      play_track:
        description: 'Google Play track for a release (needs the PLAY_SERVICE_ACCOUNT_JSON secret)'
        required: false
        type: choice
        default: internal
        options:
          - internal
          - alpha
          - beta
          - production
      testflight:
        description: 'Upload the iOS build to TestFlight (needs the ASC_* and IOS_* secrets)'
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      build_android:
        required: false
        type: boolean
        default: true
      build_ios:
        required: false
        type: boolean
        default: true
      create_release:
        required: false
        type: boolean
        default: false
      bump:
        required: false
        type: string
        default: patch
      play_track:
        required: false
        type: string
        default: internal
      testflight:
        required: false
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # Builds the web bundle the native apps ship, and their version, once for
  # both platform jobs. cap:prune copies dist/bible-app/browser to the webDir
  # (dist/bible-app/capacitor) without the prerendered route pages.
  build-native-web:
    if: ${{ github.event_name == 'push' || inputs.build_android || inputs.build_ios || inputs.testflight }}
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.version.outputs.name }}
      version_code: ${{ steps.version.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: |
          set -e
          npm run build
          npm run cap:prune

      - name: Upload native web bundle
        uses: actions/upload-artifact@v4
        with:
          name: native-web
          path: dist/bible-app/capacitor
          retention-days: 1

      # Release tag, or the next version from the latest tag. Format of the
      # build number: 1.2.3 -> 1002003.
      - name: Compute version
        id: version
        run: |
          set -e
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG_NAME="${{ github.ref_name }}"
          else
            LATEST=$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
            LATEST=${LATEST:-v0.0.0}
            VERSION=${LATEST#v}
            MAJOR=$(echo "$VERSION" | cut -d. -f1)
            MINOR=$(echo "$VERSION" | cut -d. -f2)
            PATCH=$(echo "$VERSION" | cut -d. -f3)
            
            if [[ "${{ inputs.create_release }}" == "true" ]]; then
              BUMP="${{ inputs.bump }}"
              case "$BUMP" in
                major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
                minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
                *)     PATCH=$((PATCH + 1)) ;;
              esac
            fi
            TAG_NAME="v${MAJOR}.${MINOR}.${PATCH}"
          fi
          
          VERSION_NAME=${TAG_NAME#v}
          MAJOR=$(echo "$VERSION_NAME" | cut -d. -f1)
          MINOR=$(echo "$VERSION_NAME" | cut -d. -f2)
          PATCH=$(echo "$VERSION_NAME" | cut -d. -f3)
          # Format: 1.2.3 -> 1002003
          VERSION_CODE=$(( MAJOR * 1000000 + MINOR * 1000 + PATCH ))
          
          echo "versionName=$VERSION_NAME versionCode=$VERSION_CODE"
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"


  build-android:
    needs: build-native-web
    if: ${{ github.event_name == 'push' || inputs.build_android }}
    outputs:
      apk_signed: ${{ steps.check-signing.outputs.apk_signed }}
    runs-on: ubuntu-latest
    env:
      HAS_ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      # Read by android/app/build.gradle as -PversionCode / -PversionName.
      ORG_GRADLE_PROJECT_versionCode: ${{ needs.build-native-web.outputs.version_code }}
      ORG_GRADLE_PROJECT_versionName: ${{ needs.build-native-web.outputs.version_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Download native web bundle
        uses: actions/download-artifact@v4
        with:
          name: native-web
          path: dist/bible-app/capacitor

      # android/ is committed (manifest, signing, icons); sync only copies the
      # web bundle and plugin list into it.
      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Decode Keystore
        if: ${{ env.HAS_ANDROID_KEYSTORE != '' }}
        run: |
          set -e
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release-key.jks

      - name: Create keystore.properties
        if: ${{ env.HAS_ANDROID_KEYSTORE != '' }}
        run: |
          set -e
          cat > android/keystore.properties << EOF
          storeFile=release-key.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Build Android APK
        run: |
          set -e
          cd android
          if [ -n "${HAS_ANDROID_KEYSTORE}" ]; then
            echo "Building Release APK..."
            ./gradlew assembleRelease
          else
            echo "Building Debug APK (no keystore provided)..."
            ./gradlew assembleDebug
          fi

      # Play installs and GitHub/Zapstore APKs can only update each other when
      # they carry the same signing certificate, and App Links only verify for
      # certificates listed in assetlinks.json. That file is the pinned list:
      # fail the release rather than ship an APK signed with another key.
      - name: Verify release signing certificate
        if: ${{ env.HAS_ANDROID_KEYSTORE != '' }}
        run: |
          set -euo pipefail
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          APK=android/app/build/outputs/apk/release/app-release.apk
          OUTPUT=$("$APKSIGNER" verify --print-certs "$APK")
          # The line format varies by apksigner version and scheme:
          # "Signer #1 certificate SHA-256 digest: …",
          # "V2 Signer: certificate SHA-256 digest: …",
          # "Signer (minSdkVersion=…, …) certificate SHA-256 digest: …".
          ACTUAL=$(grep -v '^Source Stamp' <<< "$OUTPUT" \
            | sed -n 's/^.*Signer.* certificate SHA-256 digest: //p' \
            | tr 'a-f' 'A-F' | sed 's/../&:/g; s/:$//' | sort -u)
          if [ -z "$ACTUAL" ]; then
            echo "$OUTPUT"
            echo "::error::Could not read the release APK's signing certificate from apksigner."
            exit 1
          fi
          EXPECTED=$(node -p "require('./public/.well-known/assetlinks.json').flatMap((s) => s.target.sha256_cert_fingerprints ?? []).join('\\n')")
          echo "APK signed with: $ACTUAL"
          while read -r CERT; do
            if ! grep -qxF "$CERT" <<< "$EXPECTED"; then
              echo "::error::The release APK's signing certificate $CERT is not listed in public/.well-known/assetlinks.json. Existing installs could not update to it. If the key change is intended, add its fingerprint there first."
              exit 1
            fi
          done <<< "$ACTUAL"

      - name: Set signing output
        id: check-signing
        run: |
          if [ -n "${HAS_ANDROID_KEYSTORE}" ]; then
            echo "apk_signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "apk_signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/app/build/outputs/apk/**/*.apk
          retention-days: 30

      - name: Build Android AAB
        run: |
          set -e
          cd android
          if [ -n "${HAS_ANDROID_KEYSTORE}" ]; then
            echo "Building Release AAB..."
            ./gradlew bundleRelease
          else
            echo "Building Debug AAB (no keystore provided)..."
            ./gradlew bundleDebug
          fi

      - name: Upload Android AAB
        uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: android/app/build/outputs/bundle/**/*.aab
          retention-days: 30

  build-ios-macos:
    needs: build-native-web
    if: ${{ github.event_name == 'push' || inputs.build_ios || inputs.testflight }}
    runs-on: macos-latest
    # A TestFlight upload takes the App Store Connect API key (secrets
    # ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8_BASE64), the distribution
    # certificate (IOS_DIST_P12_BASE64, IOS_DIST_P12_PASSWORD) and its App
    # Store profile (IOS_PROFILE_BASE64), which names the app.
    env:
      UPLOAD_TO_TESTFLIGHT: ${{ inputs.testflight }}
      # The committed project pins 1.0 (1); App Store Connect rejects a
      # repeated build number, so both come from the release version.
      MARKETING_VERSION: ${{ needs.build-native-web.outputs.version_name }}
      CURRENT_PROJECT_VERSION: ${{ needs.build-native-web.outputs.version_code }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download native web bundle
        uses: actions/download-artifact@v4
        with:
          name: native-web
          path: dist/bible-app/capacitor

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Sync Capacitor iOS
        run: |
          set -e
          npx cap sync ios
          echo "Listing ios/App contents:"
          ls -R ios/App
          echo "Listing available destinations:"
          xcodebuild -project ios/App/App.xcodeproj -scheme App -showdestinations || true

      # Test builds reuse the latest tag's version, and App Store Connect
      # refuses a build number it has already seen for a version, so each
      # upload adds the run: v1.0.12, run 15 -> build 1000012.15.1.
      - name: Number the TestFlight build
        if: ${{ env.UPLOAD_TO_TESTFLIGHT == 'true' }}
        run: echo "CURRENT_PROJECT_VERSION=$CURRENT_PROJECT_VERSION.$GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"

      # Always archived unsigned: the TestFlight upload signs afterwards.
      # Signing here would need provisioning settings that the Swift packages'
      # targets refuse when set from the command line.
      - name: Build iOS app (Unsigned)
        run: |
          set -e
          cd ios/App
          xcodebuild -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath ./build/iOS.xcarchive \
            archive \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$CURRENT_PROJECT_VERSION" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      # The app's team is an individual membership, where only the Account
      # Holder may create certificates, so Xcode's cloud signing is refused to
      # the runner and the API key alike. The build is signed with the
      # certificate and App Store profile he made (ios/scripts/sign-ipa.sh),
      # from a throwaway keychain; the key only uploads it.
      - name: Sign and upload to TestFlight
        if: ${{ env.UPLOAD_TO_TESTFLIGHT == 'true' }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          IOS_DIST_P12_BASE64: ${{ secrets.IOS_DIST_P12_BASE64 }}
          IOS_DIST_P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: |
          set -e
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 24)
          trap 'security delete-keychain "$KEYCHAIN" 2> /dev/null; rm -f "$RUNNER_TEMP"/*.p12 "$RUNNER_TEMP"/*.p8' EXIT
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$IOS_DIST_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/distribution.p12"
          security import "$RUNNER_TEMP/distribution.p12" -k "$KEYCHAIN" \
            -P "$IOS_DIST_P12_PASSWORD" -T /usr/bin/codesign > /dev/null
          # The intermediate that issues Apple Distribution certificates, so
          # codesign can build the chain whatever the runner image holds.
          curl -fsSL https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer \
            -o "$RUNNER_TEMP/AppleWWDRCAG3.cer"
          security import "$RUNNER_TEMP/AppleWWDRCAG3.cer" -k "$KEYCHAIN" > /dev/null
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          echo "$IOS_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/AppStore.mobileprovision"

          mkdir -p ios/App/build/output
          ios/scripts/sign-ipa.sh ios/App/build/iOS.xcarchive \
            "$RUNNER_TEMP/AppStore.mobileprovision" "$KEYCHAIN" \
            ios/App/build/output/App.ipa

          echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          xcrun altool --upload-app -f ios/App/build/output/App.ipa -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" \
            --p8-file-path "$RUNNER_TEMP/AuthKey.p8"

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-app
          path: |
            ios/App/build/output/*.ipa
            ios/App/build/iOS.xcarchive
          retention-days: 30

  create-tag:
    name: Create Git Tag
    # Only run on manual dispatch when create_release is true
    if: |
      github.event_name == 'workflow_dispatch' &&
      inputs.create_release == true
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.tag.outputs.tag_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate next version and push tag
        id: tag
        run: |
          set -e

          # Find the latest semver tag (vX.Y.Z); fall back to v0.0.0 if none exists
          LATEST=$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          LATEST=${LATEST:-v0.0.0}
          echo "Latest tag: $LATEST"

          # Strip the leading 'v'
          VERSION=${LATEST#v}
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          PATCH=$(echo "$VERSION" | cut -d. -f3)

          BUMP="${{ inputs.bump }}"
          case "$BUMP" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            *)     PATCH=$((PATCH + 1)) ;;
          esac

          TAG="v${MAJOR}.${MINOR}.${PATCH}"
          echo "New tag: $TAG"

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG" -m "Release $TAG"
          git push origin "$TAG"
          echo "tag_name=$TAG" >> "$GITHUB_OUTPUT"

  # Releases only (a v* tag push, or a manual run with create_release), so
  # test runs never reach Play, whose version codes must keep increasing. A
  # manual release waits for its tag, like create-release, so Play never gets
  # a build whose tag failed to push. The app must already exist in Play
  # Console with one release uploaded by hand; the API cannot create it.
  upload-play:
    name: Upload to Google Play
    needs: [build-android, create-tag]
    if: |
      always() &&
      needs.build-android.result == 'success' &&
      needs.build-android.outputs.apk_signed == 'true' &&
      (
        (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
        (github.event_name == 'workflow_dispatch' && inputs.create_release == true && needs.create-tag.result == 'success')
      )
    runs-on: ubuntu-latest
    env:
      HAS_PLAY_SERVICE_ACCOUNT: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - name: Download Android AAB artifact
        if: ${{ env.HAS_PLAY_SERVICE_ACCOUNT != '' }}
        uses: actions/download-artifact@v4
        with:
          name: android-aab
          path: aab

      - name: Upload to Google Play
        if: ${{ env.HAS_PLAY_SERVICE_ACCOUNT != '' }}
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: org.capuchinhos.biblia
          releaseFiles: aab/**/app-release.aab
          track: ${{ inputs.play_track || 'internal' }}
          status: completed

  create-release:
    name: Create GitHub Release
    needs: [build-android, create-tag]
    # Run on version tag pushes OR on manual dispatch when create_release is enabled
    if: |
      always() &&
      needs.build-android.result == 'success' &&
      needs.build-android.outputs.apk_signed == 'true' &&
      (
        (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
        (github.event_name == 'workflow_dispatch' && inputs.create_release == true && needs.create-tag.result == 'success')
      )
    runs-on: ubuntu-latest
    steps:
      - name: Download Android APK artifact
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: release-assets

      - name: List downloaded assets
        run: find release-assets -type f

      - name: Resolve tag name
        id: resolve-tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag_name=${{ needs.create-tag.outputs.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag_name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.resolve-tag.outputs.tag_name }}
          name: "Release ${{ steps.resolve-tag.outputs.tag_name }}"
          draft: false
          prerelease: ${{ contains(steps.resolve-tag.outputs.tag_name, '-') }}
          generate_release_notes: true
          files: release-assets/**/*.apk
