name: Claude Review
on:
  pull_request:
    types: [opened, ready_for_review, reopened]
jobs:
  review:
    if: ${{ !github.event.pull_request.draft && github.event.pull_request.user.type != 'Bot' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        id: claude
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-plugins-official.git"
          plugins: "code-review@claude-plugins-official"
          # The plugin's command allows only gh commands and tells its bug agents to judge the diff alone,
          # which found nothing on 9 of 11 PRs; the prompt's last paragraph and Read/Grep/Glob below let
          # them read the code around the change.
          # The agent tool's own guidance is not to spawn unasked, and left alone the main model
          # reviews the diff itself, so ask for the plugin's agents outright. They must run in the
          # foreground: the action exits when the main model ends its turn to wait for one.
          prompt: >-
            /code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}
            The repo owner asks for the full multi-agent review: launch every step's agents with the Task tool,
            in the foreground (run_in_background: false), on the model each step names, and do not review the diff yourself.
            Reopening a PR asks for a fresh review, so drop step 1's check for an earlier Claude comment.
            Before posting, read the inline comments already on the PR with
            `gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments --paginate`
            and skip any issue already commented on. Do not post the no-issues comment if the PR already has one.
            This repository is checked out at the PR's merge commit, and this replaces the command's "diff only" limits:
            the bug agents of step 4 and the validators of step 5 must read the changed files in full with Read,
            and use Grep and Glob to find and read the callers, templates, other users of anything the diff renames,
            removes or adds a control to, and the specs of the changed code, before deciding. Tell each of them so.
            Also flag a bug that needs a particular input or state when the agent can name that input and
            the lines that mishandle it; a validator confirms it by reading the code, never by running it.
            Style, taste and unproven "might" concerns stay out.
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment,Read,Grep,Glob,Bash(git log:*),Bash(git show:*),Bash(gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments:*)"'
      # Prints tool and model names only, since this repo's Actions logs are public.
      - name: Check the review ran its agents
        if: steps.claude.outputs.execution_file != ''
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          jq -r '.[] | select(.type == "assistant") | .message.content[]? | select(.type == "tool_use") | "\(.name) \(.input.model // "")"' "$EXECUTION_FILE"
          jq -r 'last | .permission_denials // [] | map(.tool_name) | group_by(.) | map("denied \(.[0]) x\(length)") | .[]' "$EXECUTION_FILE" || true
          jq -e 'last | .is_error | not' "$EXECUTION_FILE" > /dev/null || { echo "::error::The review ended in an error, so it may have posted nothing."; exit 1; }
          jq -e 'any(.[]; .type == "assistant" and any(.message.content[]?; .type == "tool_use" and (.name == "Agent" or .name == "Task")))' "$EXECUTION_FILE" > /dev/null || { echo "::error::The review launched no agents."; exit 1; }
          jq -e 'any(.[]; .type == "assistant" and any(.message.content[]?; .type == "tool_use" and .input.model == "opus"))' "$EXECUTION_FILE" > /dev/null || echo "::warning::The review stopped before its opus bug reviewers ran."
