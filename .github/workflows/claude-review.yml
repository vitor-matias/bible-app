name: Claude Review
on:
  pull_request:
    types: [opened, ready_for_review, reopened]
jobs:
  review:
    if: ${{ !github.event.pull_request.draft && github.event.pull_request.user.type != 'Bot' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-plugins-official.git"
          plugins: "code-review@claude-plugins-official"
          # The Task tool's own guidance says not to spawn agents unasked, and left alone the
          # main model reviews the diff itself, so ask for the plugin's agents outright.
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }} The repo owner asks for and pays for the full multi-agent review: launch every step's agents with the Task tool, on the model each step names, and do not review the diff yourself."
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
