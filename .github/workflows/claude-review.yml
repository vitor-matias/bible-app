name: Claude Review
on:
  pull_request:
    types: [opened, ready_for_review, reopened, synchronize]
# One review per PR at a time: a push while one is running replaces it.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  review:
    if: ${{ !github.event.pull_request.draft && github.event.pull_request.user.type != 'Bot' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # write: the last step approves a clean review with the job's token.
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        id: claude
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-plugins-official.git"
          plugins: "code-review@claude-plugins-official"
          # The plugin's command allows only gh commands and tells its bug agents to judge the diff alone,
          # which found nothing on 9 of 11 PRs; the prompt's last paragraph and Read/Grep/Glob below let
          # them read the code around the change.
          # The agent tool's own guidance is not to spawn unasked, and left alone the main model
          # reviews the diff itself, so ask for the plugin's agents outright. They must run in the
          # foreground: the action exits when the main model ends its turn to wait for one.
          prompt: >-
            /code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}
            The repo owner asks for the full multi-agent review: launch every step's agents with the Task tool,
            in the foreground (run_in_background: false), on the model each step names, and do not review the diff yourself.
            Every push and every reopening asks for a fresh review, so drop step 1's check for an earlier Claude comment.
            Before posting, read the inline comments already on the PR with
            `gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments --paginate`
            and skip any issue already commented on. Do not post the no-issues comment if the PR already has one.
            This repository is checked out at the PR's merge commit, and this replaces the command's "diff only" limits:
            the bug agents of step 4 and the validators of step 5 must read the changed files in full with Read,
            and use Grep and Glob to find and read the callers, templates, other users of anything the diff renames,
            removes or adds a control to, and the specs of the changed code, before deciding. Tell each of them so.
            Also flag a bug that needs a particular input or state when the agent can name that input and
            the lines that mishandle it; a validator confirms it by reading the code, never by running it.
            Style, taste and unproven "might" concerns stay out.
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment,Read,Grep,Glob,Bash(git log:*),Bash(git show:*),Bash(gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments:*)"'
      # Prints tool and model names only, since this repo's Actions logs are public.
      - name: Check the review ran its agents
        if: steps.claude.outputs.execution_file != ''
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          jq -r '.[] | select(.type == "assistant") | .message.content[]? | select(.type == "tool_use") | "\(.name) \(.input.model // "")"' "$EXECUTION_FILE"
          jq -r 'last | .permission_denials // [] | map(.tool_name) | group_by(.) | map("denied \(.[0]) x\(length)") | .[]' "$EXECUTION_FILE" || true
          jq -e 'last | .is_error | not' "$EXECUTION_FILE" > /dev/null || { echo "::error::The review ended in an error, so it may have posted nothing."; exit 1; }
          jq -e 'any(.[]; .type == "assistant" and any(.message.content[]?; .type == "tool_use" and (.name == "Agent" or .name == "Task")))' "$EXECUTION_FILE" > /dev/null || { echo "::error::The review launched no agents."; exit 1; }
          jq -e 'any(.[]; .type == "assistant" and any(.message.content[]?; .type == "tool_use" and .input.model == "opus"))' "$EXECUTION_FILE" > /dev/null || echo "::warning::The review stopped before its opus bug reviewers ran."
      # A clean review approves the PR as github-actions[bot]: the action revokes the Claude app's token
      # before this step runs. That needs the repository setting "Allow GitHub Actions to create and
      # approve pull requests" (Settings > Actions > General). Only a full review counts: the
      # step above has passed, the opus reviewers ran, this run posted no inline comment, and no thread
      # Claude opened earlier is still unresolved. The approval names the commit it read.
      - name: Approve when the review found nothing
        if: steps.claude.outputs.execution_file != ''
        env:
          GH_TOKEN: ${{ github.token }}
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          used() { jq -e --arg t "$1" 'any(.[]; .type == "assistant" and any(.message.content[]?; .type == "tool_use" and (.name == $t or .input.model == $t)))' "$EXECUTION_FILE" > /dev/null; }
          # An approval of an earlier commit must not outlive a review that found something.
          withdraw() {
            gh api "repos/$REPO/pulls/$PR/reviews" --paginate --jq '.[] | select(.user.login == "github-actions[bot]" and .state == "APPROVED") | .id' | while read -r id; do
              gh api -X PUT "repos/$REPO/pulls/$PR/reviews/$id/dismissals" -f message="A later review found issues." -f event=DISMISS > /dev/null \
                || echo "::warning::Could not withdraw the earlier approval."
            done
          }
          used opus || { echo "No approval: the bug reviewers did not run."; exit 0; }
          ! used mcp__github_inline_comment__create_inline_comment || { echo "No approval: the review posted comments."; withdraw; exit 0; }
          # Read again now: the review took minutes, and the PR may have been closed or pushed to since.
          now=$(gh api "repos/$REPO/pulls/$PR" --jq '"\(.state) \(.head.sha)"') \
            || { echo "::warning::No approval: could not read the PR."; exit 0; }
          [ "$now" = "open $HEAD_SHA" ] || { echo "No approval: the PR is closed or has commits the review did not read."; exit 0; }
          # Unresolved threads a bot named claude opened. More than one page of threads is not counted: no approval.
          open=$(gh api graphql -F owner="${REPO%/*}" -F name="${REPO#*/}" -F pr="$PR" -f query='
            query($owner: String!, $name: String!, $pr: Int!) { repository(owner: $owner, name: $name) { pullRequest(number: $pr) {
              reviewThreads(first: 100) { pageInfo { hasNextPage } nodes { isResolved comments(first: 1) { nodes { author { __typename login } } } } } } } }' \
            --jq '.data.repository.pullRequest.reviewThreads | if .pageInfo.hasNextPage then "many" else ([.nodes[] | select(.isResolved | not) | .comments.nodes[0].author | select(. != null and .__typename == "Bot" and .login == "claude")] | length) end') \
            || { echo "::warning::No approval: could not read the PR's review threads."; exit 0; }
          [ "$open" = 0 ] || { echo "No approval: unresolved Claude threads: $open."; withdraw; exit 0; }
          gh api "repos/$REPO/pulls/$PR/reviews" -f event=APPROVE -f commit_id="$HEAD_SHA" \
            -f body="Automated review of ${HEAD_SHA:0:7} found no issues. Each later push gets its own review." > /dev/null \
            || echo "::warning::The review found nothing but could not approve the PR."
