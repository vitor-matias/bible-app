name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main, 'feat/**' ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: 'npm'
      - run: npm ci
      - name: Run Biome Lint
        run: npx biome ci src vitest-base.config.mts

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run Tests (Headless)
        run: npx ng test --watch=false

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: 'npm'
      - run: npm ci
      - name: Build Production
        run: npx ng build --configuration=production

  # Playwright specs in e2e/ against `ng serve`. Like the dev server they use,
  # they read the real books, chapters and search from the public API
  # (proxy.conf.js), so this job needs the runner to reach that API.
  e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run Playwright tests
        run: npx playwright test
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-results
          path: test-results
          retention-days: 7

  # Compiles the native Android app around the web bundle it ships, runs its
  # JVM unit tests and Android lint, and builds the release APK through R8,
  # so a shrinking or keep-rule break fails here too. Nothing is signed;
  # build-all-platforms.yml makes the signed release builds.
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26
          cache: 'npm'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'
      - run: npm ci
      # compileSdk 37 (variables.gradle), which the runner's SDK may not have.
      - name: Android SDK 37
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37.0" "build-tools;37.0.0" > /dev/null'
      # cap:prune copies the build to Capacitor's webDir without the
      # prerendered route pages; sync copies it and the plugins into android/.
      - name: Build the native web bundle
        run: |
          set -e
          npm run build
          npm run cap:prune
          npx cap sync android
      - name: Unit tests, lint and R8 release APK
        working-directory: android
        run: ./gradlew testDebugUnitTest lintDebug assembleRelease
      - name: Upload test and lint reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-reports
          path: android/app/build/reports
          retention-days: 7
