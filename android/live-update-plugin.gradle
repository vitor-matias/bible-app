// Replaces @capawesome/capacitor-live-update's android/build.gradle (see
// settings.gradle): it applies org.jetbrains.kotlin.android, which AGP 9 rejects.
// shortcut: versions copied from plugin 8.8.1, delete this file and the
// settings.gradle line once the plugin supports AGP 9.
apply plugin: 'com.android.library'

android {
    namespace = "io.capawesome.capacitorjs.plugins.liveupdate"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        minSdkVersion rootProject.ext.minSdkVersion
        consumerProguardFiles 'consumer-rules.pro'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

kotlin {
    jvmToolchain(21)
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation project(':capacitor-android')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "net.lingala.zip4j:zip4j:2.11.5"
    implementation "com.squareup.okhttp3:okhttp:5.3.2"
    implementation "com.squareup.okhttp3:okhttp-brotli:5.3.2"
    compileOnly "io.ionic:liveupdateprovider:1.0.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0"
}
