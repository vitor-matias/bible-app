<div class="book-filter-container">
  <input
    type="search"
    class="book-filter-input"
    placeholder="Filtrar livros..."
    aria-label="Filtrar livros"
    (input)="filterBooks($any($event.target).value)"
  />
</div>
<div class="bible-books-container">
  <!-- h2: the toolbar h1 precedes these in the DOM, and they are the drawer's
       only heading structure for screen readers. -->
  <div class="column" role="group" aria-labelledby="otTestamentLabel">
    <h2 class="testament-label" id="otTestamentLabel">Antigo Testamento</h2>

    <mat-tree [dataSource]="otDataSource" [treeControl]="otTreeControl">
      <!-- This is the tree node template for leaf nodes -->
      <mat-tree-node *matTreeNodeDef="let node" matTreeNodePadding>
        <button mat-flat-button class="bookSelectorButton" (click)="submit(node.name)" [attr.data-book-id]="node.name"
          [class.highlight]="node.name === selectedBookId">
          {{entryLabel(node.name)}}
        </button>
      </mat-tree-node>
      <!-- This is the tree node template for expandable nodes -->
      <mat-tree-node class="book-group" *matTreeNodeDef="let node;when: hasChild" matTreeNodePadding matTreeNodeToggle
        [cdkTreeNodeTypeaheadLabel]="node.name">
        <button mat-icon-button matTreeNodeToggle [attr.aria-label]="'Toggle ' + node.name">
          <mat-icon class="mat-icon-rtl-mirror">
            {{otTreeControl.isExpanded(node) ? 'expand_more' : 'chevron_right'}}
          </mat-icon>
        </button>
        {{node.name}}
      </mat-tree-node>
    </mat-tree>

  </div>
  <div class="column" role="group" aria-labelledby="ntTestamentLabel">
    <h2 class="testament-label" id="ntTestamentLabel">Novo Testamento</h2>

    <mat-tree [dataSource]="ntDataSource" [treeControl]="ntTreeControl">
      <!-- This is the tree node template for leaf nodes -->
      <mat-tree-node *matTreeNodeDef="let node" matTreeNodePadding>
        <button mat-flat-button class="bookSelectorButton" (click)="submit(node.name)" [attr.data-book-id]="node.name"
          [class.highlight]="node.name === selectedBookId">
          {{entryLabel(node.name)}}
        </button>
      </mat-tree-node>
      <!-- This is the tree node template for expandable nodes -->
      <mat-tree-node class="book-group" *matTreeNodeDef="let node;when: hasChild" matTreeNodePadding matTreeNodeToggle
        [cdkTreeNodeTypeaheadLabel]="node.name">
        <button mat-icon-button matTreeNodeToggle [attr.aria-label]="'Toggle ' + node.name">
          <mat-icon class="mat-icon-rtl-mirror">
            {{ntTreeControl.isExpanded(node) ? 'expand_more' : 'chevron_right'}}
          </mat-icon>
        </button>
        {{node.name}}
      </mat-tree-node>
    </mat-tree>

  </div>
</div>
