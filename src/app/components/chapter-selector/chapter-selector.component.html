<div class="chapterSelectorContainer">
  @if (bookmarks$ | async; as bookmarksMap) {
    <!-- One tab stop: the arrows, Home and End move between the chapters. -->
    <mat-list (keydown)="moveFocus($event)">
      @for (chapter of chapters(); track chapter.number) {
      <mat-list-item>
        <button type="button" class="chapterSelectorButton" mat-flat-button (click)="submit(chapter.number)"
          [tabindex]="chapter.number === tabStop() ? 0 : -1" (focus)="focused.set(chapter.number)"
          [ngClass]="{ 'highlight': chapter.number === highlighted() }">
          <!-- The introduction has no number: skip the slot unless it is
               bookmarked, so the ribbon stays visible. -->
          @if (getChapterLabel(chapter) || bookmarksMap.has(chapter.number)) {
          <span class="number-wrapper">
            @if(bookmarksMap.has(chapter.number)){
            <mat-icon [style.color]="ribbonColor(bookmarksMap.get(chapter.number))" class="bookmark-icon">bookmark</mat-icon>
            }
            <span [ngClass]="{ 'bookmarked': bookmarksMap.has(chapter.number), 'on-ribbon': isRibbonColor(bookmarksMap.get(chapter.number)) }">{{ getChapterLabel(chapter) }}</span>
          </span>
          }
          <span class="chapter-title">{{getChapterDisplay(chapter)}}</span>
        </button>
      </mat-list-item>
      }
    </mat-list>
  }
</div>
