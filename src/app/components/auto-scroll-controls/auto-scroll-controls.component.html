@if (!native && (audioMode() || !paged())) {
<div class="auto-scroll-controls" [class.audio]="audioMode()">
  @if (audioMode()) {
  <div class="audio-player" role="group" aria-label="+365">
    <div class="audio-caption">{{ bookName() }} {{ chapter() }}</div>
    <mat-slider class="audio-position" [min]="chapterStart()" [max]="seekable() ? chapterEnd() : chapterStart() + 1"
      [step]="0.1" [disabled]="!seekable()" [displayWith]="spokenPosition">
      <input matSliderThumb aria-label="Posição no +365" [value]="sliderValue()" (dragStart)="holdSlider()"
        (dragEnd)="dragging.set(false)" (valueChange)="player.seek($event)">
    </mat-slider>
    <!-- The slider says the same to screen readers, in words. -->
    <div class="audio-times" aria-hidden="true">
      <span>{{ elapsed() }}</span>
      <span>−{{ remaining() }}</span>
    </div>
    <div class="audio-buttons">
      @if (!paged()) {
      <button type="button" mat-icon-button class="mode-toggle" aria-label="Deslocar o texto em vez de ouvir"
        (click)="toggleMode()">
        <mat-icon>swap_vert</mat-icon>
      </button>
      } @else {
      <span></span>
      }
      <div class="audio-transport">
        <button type="button" mat-icon-button class="skip-back" aria-label="Recuar 10 segundos" [disabled]="!loaded()"
          (click)="player.skip(-10)">
          <mat-icon>replay_10</mat-icon>
        </button>
        <button class="auto-scroll-toggle audio-toggle" type="button" mat-fab
          [attr.aria-label]="playingThis() ? 'Pausar o +365' : 'Ouvir o +365'" [attr.aria-pressed]="playingThis()"
          [disabled]="!entry()" (click)="toggleAudio()">
          <mat-icon>{{ playingThis() ? 'pause' : 'play_arrow' }}</mat-icon>
        </button>
        <button type="button" mat-icon-button class="skip-forward" aria-label="Avançar 10 segundos"
          [disabled]="!loaded()" (click)="player.skip(10)">
          <mat-icon>forward_10</mat-icon>
        </button>
      </div>
      <div class="audio-rate">
        <button type="button" mat-icon-button aria-label="Diminuir velocidade do +365"
          [disabled]="!player.canSlower()" (click)="player.stepRate(-1)">
          <mat-icon>remove</mat-icon>
        </button>
        <!-- No number on screen, as in the iOS app: only screen readers hear it. -->
        <span class="rate visually-hidden" aria-live="polite">{{ rateSpoken() }}</span>
        <button type="button" mat-icon-button aria-label="Aumentar velocidade do +365"
          [disabled]="!player.canFaster()" (click)="player.stepRate(1)">
          <mat-icon>add</mat-icon>
        </button>
      </div>
    </div>
  </div>
  } @else {
  <button class="position-relative floating-nav-button auto-scroll-toggle" type="button" mat-mini-fab
    [attr.aria-label]="autoScrollEnabled ? 'Pausar deslocamento automático' : 'Ativar deslocamento automático'"
    [attr.aria-pressed]="autoScrollEnabled" [disabled]="!autoScrollEnabled && atEnd" (click)="toggleAutoScroll()">
    <mat-icon>{{ autoScrollEnabled ? 'pause' : 'play_arrow' }}</mat-icon>
  </button>
  <div class="auto-scroll-speed">
    @if (entry()) {
    <button type="button" mat-icon-button class="mode-toggle" aria-label="Ouvir o +365 em vez de deslocar"
      (click)="toggleMode()">
      <mat-icon>headphones</mat-icon>
    </button>
    }
    <button type="button" mat-icon-button aria-label="Diminuir velocidade do deslocamento automático"
      [disabled]="!canSlower" (click)="decreaseAutoScrollSpeed()">
      <mat-icon>remove</mat-icon>
    </button>
    <span class="visually-hidden" aria-live="polite">{{ autoScrollSpeedSpoken }}</span>
    <button type="button" mat-icon-button aria-label="Aumentar velocidade do deslocamento automático"
      [disabled]="!canFaster" (click)="increaseAutoScrollSpeed()">
      <mat-icon>add</mat-icon>
    </button>
  </div>
  }
</div>
}
