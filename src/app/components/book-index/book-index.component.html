@if (testaments$ | async; as testaments) {
<nav class="book-index" aria-label="Livros da Bíblia">
  <!-- Collapsed by default: the full list of 73 books is a wall of links on a
       page that is otherwise prose. It stays in the markup rather than being
       hidden with CSS — a reader can open it, which is what makes the links
       legitimately crawlable; links hidden from readers are a spam signal and
       carry little weight anyway. -->
  <details>
    <!-- The page h1 lives in the summary so it is visible whether or not the
         list is open. A single heading element is valid summary content. -->
    <summary><h1>Ler a Bíblia online</h1></summary>
    @for (testament of testaments; track testament.name) {
    <section>
      <h2>{{ testament.name }}</h2>
      <ul>
        @for (book of testament.books; track book.name) {
        <li><a [routerLink]="book.link">{{ book.name }}</a></li>
        }
      </ul>
    </section>
    }
  </details>
</nav>
}
